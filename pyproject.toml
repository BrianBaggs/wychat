[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wyoming-bridge"
version = "1.1.1"
description = "Bridges TypeWhisper's OpenAI-compatible transcription engine to a Wyoming ASR server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "coverage>=7",
    "ruff>=0.6",
    "pyright>=1.1",
]

[project.scripts]
wyoming-bridge = "wyoming_bridge:main"

[tool.setuptools]
py-modules = ["wyoming_bridge"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["wyoming_bridge.py", "test_wyoming_bridge.py"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["wyoming_bridge"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
]
show_missing = true
fail_under = 95
